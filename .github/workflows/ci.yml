name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The guard scripts must run from their .py source, never from stale bytecode.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Fast loop: formatting, lints, tests and the UI type check on desktop Linux.
  # Paused while the work focuses on Android: remove `if: false` to turn it back on.
  desktop:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The benchmarks must keep compiling (running them is a local, relative-numbers job).
      - run: cargo check -p mt-storage -p mt-backup --benches --features mt-storage/bench-support --locked
      # Coverage gate for the domain crate: money, rules and the lock's PIN policy.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov -p mt-core --locked --fail-under-lines 85 --summary-only
      - run: pnpm check
      - run: pnpm test
      - name: Web bundle size budget
        run: |
          pnpm build
          python3 scripts/bundle_size.py --max-js-gzip-kb=80
      - name: Offline guard (CSP, capabilities, network APIs)
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_offline.py config
          python3 scripts/check_offline.py source
          python3 scripts/check_debug_redaction.py
          python3 scripts/check_workflows.py

  # Supply chain: advisories, licenses, bans, sources.
  # Paused together with `desktop`: remove `if: false` to turn it back on.
  supply-chain:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny check
      - run: cargo audit

  # Debug APK plus the release-manifest guard. (The Rust/UI validation gate runs
  # in the `desktop` job.) Requires src-tauri/gen/android to be committed
  # (created once with `pnpm tauri android init`).
  android:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      # The runner image already ships the Android SDK (ANDROID_HOME) and sdkmanager;
      # android-actions/setup-android v3.2.2 fails on it ("Failed to find package 'tools'").
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Link NDK llvm-ar/llvm-ranlib under the target-prefixed names
        # openssl-src builds OpenSSL from source and calls <triple>-ar / <triple>-ranlib,
        # which current NDKs only ship as llvm-ar / llvm-ranlib.
        run: |
          bin="${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          tools="${RUNNER_TEMP}/ndk-tools"
          mkdir -p "$tools"
          for triple in aarch64-linux-android arm-linux-androideabi i686-linux-android x86_64-linux-android; do
            for tool in ar ranlib; do
              ln -sf "$bin/llvm-$tool" "$tools/$triple-$tool"
            done
          done
          echo "$tools" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          toolchain: 1.98.1
          components: clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri android build --apk --debug --target aarch64
      - name: Kotlin unit tests (Keystore classification, picker URIs)
        run: |
          cd src-tauri/gen/android
          ./gradlew :tauri-plugin-mt-keystore:testDebugUnitTest :tauri-plugin-mt-platform:testDebugUnitTest
      - name: Release manifest must not request INTERNET
        run: |
          cd src-tauri/gen/android
          # The fully merged manifest, including the AndroidX/plugin libraries:
          # a dependency could otherwise add INTERNET without being seen.
          ./gradlew :app:processUniversalReleaseManifest
          cd -
          manifest=$(find src-tauri/gen/android/app/build/intermediates/merged_manifests/universalRelease -name AndroidManifest.xml | head -1)
          test -n "$manifest"
          python3 scripts/check_offline.py manifest "$manifest"
      - name: Built release APK must not request INTERNET
        run: |
          # The final artifact is the only manifest that is certainly the shipped one.
          pnpm tauri android build --apk --target aarch64
          apk=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name '*.apk' | head -1)
          test -n "$apk"
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          python3 scripts/check_offline.py apk "$apk" "$aapt2"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: money-tracker-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
