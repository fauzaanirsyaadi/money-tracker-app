[package]
name = "mt-storage"
description = "Encrypted SQLite storage for Money Tracker: migrations and repositories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mt-core = { path = "../core" }
# SQLite + SQLCipher compiled from source; OpenSSL is vendored because Android
# has no system OpenSSL. MIT, actively maintained (rusqlite org).
rusqlite = { version = "0.40", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
# Logical backup lines. MIT OR Apache-2.0, widely used (already in the app's tree).
serde_json = "1"
# Wipes key material from memory. Apache-2.0 OR MIT, RustCrypto, maintained.
zeroize = "1"

[features]
# Demo-data seeding (`Db::seed_demo`) for the benchmarks. Never enabled by the app.
bench-support = []

[dev-dependencies]
# Statistics-driven micro-benchmarks (`cargo bench`). MIT OR Apache-2.0, bheisler/criterion-rs,
# maintained. Dev only; default features off (no plotting or parallelism crates).
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "queries"
harness = false
required-features = ["bench-support"]

[lints]
workspace = true
