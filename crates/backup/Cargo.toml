[package]
name = "mt-backup"
description = "Encrypted, streamed container for Money Tracker backups (Argon2id + XChaCha20-Poly1305)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Passphrase -> key. MIT OR Apache-2.0, RustCrypto, maintained (already used by the app lock).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
# (argon2's `zeroize` feature wipes its working memory blocks after hashing.)
# XChaCha20-Poly1305 with the STREAM construction for chunked authenticated
# encryption. Apache-2.0 OR MIT, RustCrypto, maintained.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "stream"] }
# OS random bytes for the salt and nonce prefix. ISC/MIT/Apache-2.0, rust-random (already in the tree).
getrandom = "0.3"
# NFKC for passphrases, so the same text typed on different keyboards derives the same key.
# MIT OR Apache-2.0, unicode-rs, maintained. **Pinned to an exact version on purpose**:
# the backup key is derived from the normalised text, so a release that changed the
# normalisation of any character would stop old backups opening with their own
# passphrase. Move the pin only deliberately, with the fixed vectors in `lib.rs`
# (`fixed_vectors`, checked against Python's `unicodedata`) still green.
unicode-normalization = "=0.1.25"
# Wipes derived keys and passphrase copies. Apache-2.0 OR MIT, RustCrypto, maintained.
zeroize = "1"

[dev-dependencies]
# Reads the passphrase vectors shared with the UI (testdata/). Test scope only.
# MIT OR Apache-2.0, maintained; already in the tree through the app.
serde_json = "1"

[lints]
workspace = true
