[package]
name = "mt-backup"
description = "Encrypted, streamed container for Money Tracker backups (Argon2id + XChaCha20-Poly1305)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Passphrase -> key. MIT OR Apache-2.0, RustCrypto, maintained (already used by the app lock).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# XChaCha20-Poly1305 with the STREAM construction for chunked authenticated
# encryption. Apache-2.0 OR MIT, RustCrypto, maintained.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "stream"] }
# OS random bytes for the salt and nonce prefix. ISC/MIT/Apache-2.0, rust-random (already in the tree).
getrandom = "0.3"
# Wipes derived keys and passphrase copies. Apache-2.0 OR MIT, RustCrypto, maintained.
zeroize = "1"

[lints]
workspace = true
