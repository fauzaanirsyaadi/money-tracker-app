[package]
name = "money-tracker-app"
description = "Money Tracker app: Tauri shell, command API and permissions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "money_tracker_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
mt-core = { path = "../crates/core" }
mt-storage = { path = "../crates/storage" }
tauri-plugin-mt-keystore = { path = "plugins/mt-keystore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS random bytes for the database key. Already in the tree via tauri; MIT OR Apache-2.0, rust-random.
getrandom = "0.3"
# Wipes key material from memory. Apache-2.0 OR MIT, RustCrypto, maintained.
zeroize = "1"

[lints]
workspace = true
