[workspace]
resolver = "3"
members = ["crates/core", "crates/storage", "crates/backup", "src-tauri", "src-tauri/plugins/mt-keystore", "src-tauri/plugins/mt-platform"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Optimisation guideline: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Money arithmetic must never wrap silently; an overflow aborts instead.
overflow-checks = true
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
# Keep the symbol table: the Android build extracts it for Play Console, then strips the APK.
strip = "debuginfo"
