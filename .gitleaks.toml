# gitleaks configuration (https://github.com/gitleaks/gitleaks). Default rules stay on;
# only the two known false positives below are allowed, by their exact text.
title = "Money Tracker"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures that only look like keys to the generic rule: a deliberately foreign Keystore alias name in a list of names the alias parser must ignore, and a fake account name used to prove error payloads carry no user data"
targetRules = ["generic-api-key"]
regexes = [
  '''other_alias_v1''',
  '''Rekening-Rahasia-12345''',
]
