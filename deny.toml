# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
[graph]
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "i686-linux-android",
  "x86_64-linux-android",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # GTK3 bindings are pulled in by tauri/wry on desktop Linux only; they are
  # not part of the Android build. Revisit when tauri moves off gtk3.
  # (glib RUSTSEC-2024-0429 "unsound" is only reported as a warning by cargo-audit.)
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk3-macros, desktop Linux only" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

# Our own crates have no license yet (chosen in phase 9); they are publish = false.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# Offline mode (docs/ARCHITECTURE.md, section 1): `tauri` itself pulls a small
# HTTP client stack that our code never calls. Those crates are allowed only
# through the exact parents listed here; anything else that reaches them, and
# any other network crate, fails CI. Neutralisation at runtime is the job of the
# missing INTERNET permission and the CSP (scripts/check_offline.py).
deny = [
  # --- tolerated, via named parents only -----------------------------------
  { crate = "reqwest", wrappers = ["tauri"], reason = "pulled by tauri; never called by app code" },
  { crate = "hyper", wrappers = ["reqwest", "hyper-util"], reason = "reqwest stack" },
  { crate = "hyper-util", wrappers = ["reqwest"], reason = "reqwest stack" },
  { crate = "http-body-util", wrappers = ["reqwest"], reason = "reqwest stack" },
  { crate = "tower", wrappers = ["reqwest", "tower-http"], reason = "reqwest stack" },
  { crate = "tower-http", wrappers = ["reqwest"], reason = "reqwest stack" },
  { crate = "tokio-util", wrappers = ["reqwest"], reason = "reqwest stack" },
  { crate = "socket2", wrappers = ["hyper-util", "tokio"], reason = "reqwest stack" },
  { crate = "mio", wrappers = ["tokio"], reason = "tokio runtime" },
  # --- not in the tree today: must stay out ---------------------------------
  { crate = "ureq", reason = "HTTP client" },
  { crate = "curl", reason = "HTTP client" },
  { crate = "curl-sys", reason = "HTTP client" },
  { crate = "isahc", reason = "HTTP client" },
  { crate = "surf", reason = "HTTP client" },
  { crate = "attohttpc", reason = "HTTP client" },
  { crate = "h2", reason = "HTTP/2 transport" },
  { crate = "hyper-tls", reason = "TLS for HTTP" },
  { crate = "hyper-rustls", reason = "TLS for HTTP" },
  { crate = "native-tls", reason = "TLS stack" },
  { crate = "rustls", reason = "TLS stack" },
  { crate = "tokio-rustls", reason = "TLS stack" },
  { crate = "openssl", reason = "only openssl-sys (vendored, for SQLCipher) is allowed" },
  { crate = "tungstenite", reason = "websocket" },
  { crate = "tokio-tungstenite", reason = "websocket" },
  { crate = "quinn", reason = "QUIC" },
  { crate = "hickory-resolver", reason = "DNS" },
  { crate = "trust-dns-resolver", reason = "DNS" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
