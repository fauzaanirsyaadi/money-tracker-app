# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
[graph]
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "i686-linux-android",
  "x86_64-linux-android",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # GTK3 bindings are pulled in by tauri/wry on desktop Linux only; they are
  # not part of the Android build. Revisit when tauri moves off gtk3.
  # (glib RUSTSEC-2024-0429 "unsound" is only reported as a warning by cargo-audit.)
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk3-macros, desktop Linux only" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

# Our own crates have no license yet (chosen in phase 9); they are publish = false.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
